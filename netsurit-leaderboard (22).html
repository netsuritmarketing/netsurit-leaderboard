const CLOUD_ENABLED = JSONBIN_KEY !== "YOUR_MASTER_KEY_HERE" && JSONBIN_BIN_ID !== "YOUR_BIN_ID_HERE";

async function loadFromCloud() {
  if (!CLOUD_ENABLED) return null;
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: {"X-Master-Key": JSONBIN_KEY, "X-Bin-Meta": "false"}
    });
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

async function saveToCloud(data) {
  if (!CLOUD_ENABLED) return;
  try {
    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: "PUT",
      headers: {"Content-Type":"application/json","X-Master-Key": JSONBIN_KEY},
      body: JSON.stringify(data)
    });

}

function calcMRR(region) {
  const rates = PRICING[region];
  let total = 0, missingPkg = 0;
  (state.data[region] || []).forEach(ae => {

  return { total, missingPkg };

// Decide the starting data for a region:
// baked file data wins if it is newer than what this browser has saved locally.
function initialData(region) {
  const cfg = REGIONS[region];
  const localRaw = localStorage.getItem(cfg.sk);
  const localTs  = Number(localStorage.getItem(cfg.sk + "_ts") || 0);
  const bakedTs  = BAKED ? Number(BAKED.savedAt || 0) : 0;

  if (BAKED && BAKED[region] && bakedTs >= localTs) return BAKED[region];
  if (localRaw) { try { return JSON.parse(localRaw); } catch(e) {} }
  if (BAKED && BAKED[region]) return BAKED[region];
  return cfg.init;
}

function initialTs(region) {
  const localTs = Number(localStorage.getItem(REGIONS[region].sk + "_ts") || 0);
  const bakedTs = BAKED ? Number(BAKED.savedAt || 0) : 0;
  return Math.max(localTs, bakedTs) || null;
}

let state = {
  activeTab: "us",
  expanded: {us:new Set(), sa:new Set()},
  pending: {us:{}, sa:{}},
  newAE: {us:"", sa:""},
  data: {
    us: initialData("us"),
    sa: initialData("sa"),
  },
  ts: {
    us: initialTs("us"),
    sa: initialTs("sa"),
  }
};

// Load from cloud on startup — overrides localStorage if cloud data exists
(async () => {
  const cloud = await loadFromCloud();
  if (cloud && cloud.us && cloud.sa) {
    state.data.us = cloud.us;
    state.data.sa = cloud.sa;
    if (cloud.ts) { state.ts.us = cloud.ts.us; state.ts.sa = cloud.ts.sa; }
    localStorage.setItem(REGIONS.us.sk, JSON.stringify(cloud.us));
    localStorage.setItem(REGIONS.sa.sk, JSON.stringify(cloud.sa));
  }
  renderRegion("us");
  renderRegion("sa");
  renderCombined();
  updateBrowserTs();
})();

function save(region) {
  localStorage.setItem(REGIONS[region].sk, JSON.stringify(state.data[region]));
  state.ts[region] = Date.now();
  localStorage.setItem(REGIONS[region].sk+"_ts", state.ts[region]);
  // Push both regions to cloud so everyone stays in sync
  saveToCloud({us: state.data.us, sa: state.data.sa, ts: state.ts});
  renderRegion(region);
  renderCombined();
  updateBrowserTs();
}
function mutate(region, fn) { fn(); save(region); }

function stats(region, clients) {
  const cfg = REGIONS[region];
  return {
    signed:   clients.filter(c => cfg.SIGNED_S.has(c.status)).length,
    attended: clients.filter(c => cfg.ATTENDED_S.has(c.status)).length,
    sched:    clients.length,
  };
}

function ranked(region, data) {
  const cfg = REGIONS[region];
  const score = (ae) => {
    const paid    = ae.clients.filter(c=>c.status==="Signed for Paid").length;
    const trial   = ae.clients.filter(c=>c.status==="Signed for Free Trial").length;
    // "Attended" here means an actual attended meeting, not a signed status —
    // avoids double-counting paid/trial clients into this bucket.
    const attended = ae.clients.filter(c=>c.status==="Demo Attended"||c.status==="Discovery Attended").length;
    // Active pipeline = anything still live, i.e. not cancelled.
    const active  = ae.clients.filter(c=>c.status!=="Cancelled").length;
    const isZero  = paid===0 && trial===0 && attended===0;
    return { paid, trial, attended, active, isZero };
  };
  return [...data].sort((a,b) => {
    const sa = score(a), sb = score(b);
    // Anyone with nothing on the board drops below everyone who has something,
    // no matter how many cancelled accounts they're carrying.
    if (sa.isZero !== sb.isZero) return sa.isZero ? 1 : -1;
    if (sb.paid !== sa.paid) return sb.paid - sa.paid;
    if (sb.trial !== sa.trial) return sb.trial - sa.trial;
    if (sb.attended !== sa.attended) return sb.attended - sa.attended;
    if (sb.active !== sa.active) return sb.active - sa.active;
    return a.name.localeCompare(b.name);
  });
}

const fmtTime = ts => ts ? new Date(Number(ts)).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "Never";
const bStyle = SS => s => { const x = SS[s]||Object.values(SS)[Object.keys(SS).length-1]; return `background:${x.bg};color:${x.color};border-color:${x.border}`; };

function renderCombined() {
  const freeUS = state.data.us.reduce((s,ae)=>s+ae.clients.filter(c=>c.status==="Signed for Free Trial").length,0);
  const freeSA = state.data.sa.reduce((s,ae)=>s+ae.clients.filter(c=>c.status==="Signed for Free Trial").length,0);
  const paidUS = state.data.us.reduce((s,ae)=>s+ae.clients.filter(c=>c.status==="Signed for Paid").length,0);
  const paidSA = state.data.sa.reduce((s,ae)=>s+ae.clients.filter(c=>c.status==="Signed for Paid").length,0);
  const totalPaid = paidUS + paidSA;
  const mrrUS = calcMRR("us");
  const mrrSA = calcMRR("sa");
  const missingTotal = mrrUS.missingPkg + mrrSA.missingPkg;
  const pct = Math.min(100, Math.round(totalPaid/GOAL*100));
  const bc = pct>=100?"var(--green-mid)":pct>=66?"var(--blue-mid)":"var(--amber-mid)";
  document.getElementById("combined-progress").innerHTML = `
    <div class="mrr-row">
      <div class="metric mrr-card"><div class="metric-label">🇺🇸 US MRR</div><div class="metric-value mrr-value">${fmtMoney("us",mrrUS.total)}</div></div>
      <div class="metric mrr-card"><div class="metric-label">🇿🇦 SA MRR</div><div class="metric-value mrr-value">${fmtMoney("sa",mrrSA.total)}</div></div>
    </div>
    ${missingTotal>0?`<p class="mrr-warn"><i class="ti ti-alert-triangle" style="font-size:12px"></i> ${missingTotal} paid client${missingTotal===1?" has no":"s have no"} package selected — not counted in MRR</p>`:""}
    <div class="metrics">
      <div class="metric"><div class="metric-label">🇺🇸 US Signed for Paid</div><div class="metric-value">${paidUS}</div></div>
      <div class="metric"><div class="metric-label">🇿🇦 SA Signed for Paid</div><div class="metric-value">${paidSA}</div></div>
      <div class="metric${pct>=100?' accent':''}"><div class="metric-label">Paid clients goal</div><div class="metric-value" style="color:${bc}">${totalPaid} / ${GOAL}</div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-labels"><span>${totalPaid} of ${GOAL} paid clients</span><span style="font-weight:500;color:${bc}">${pct}% to goal</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:${bc}"></div></div>
    </div>`;
}

function renderRegion(region) {
  const cfg = REGIONS[region];
  const SS = cfg.SS;
  const STATUSES = Object.keys(SS);
  const LEGEND = cfg.legendStatuses || STATUSES;
  const bs = bStyle(SS);
  const r = ranked(region, state.data[region]);
  const total = state.data[region].reduce((s,ae)=>s+ae.clients.length,0);
  const totalTrials = state.data[region].reduce((s,ae)=>s+ae.clients.filter(c=>c.status===cfg.trialStatus).length,0);
  const totalPaid = state.data[region].reduce((s,ae)=>s+ae.clients.filter(c=>c.status==="Signed for Paid").length,0);

  const mrr = calcMRR(region);

  let html = `
  <div class="metrics">
    <div class="metric mrr-card"><div class="metric-label">MRR</div><div class="metric-value mrr-value" style="font-size:22px">${fmtMoney(region,mrr.total)}</div></div>
    <div class="metric" style="${totalTrials>0?'background:var(--paid-bg);border-color:var(--paid-border)':''}"><div class="metric-label" style="${totalTrials>0?'color:var(--paid-color);opacity:0.85':''}">Free Trial total</div><div class="metric-value" style="${totalTrials>0?'color:var(--paid-color)':''}">${totalTrials}</div></div>
    <div class="metric${totalPaid>0?' accent':''}"><div class="metric-label">Signed for Paid</div><div class="metric-value">${totalPaid}</div></div>
  </div>
  <div class="legend">${LEGEND.map(s=>`<span class="badge" style="${bs(s)}">${s}</span>`).join("")}</div>
  <p style="font-size:10px;color:var(--text-faint);margin-bottom:1rem">Sprint period: May 1 – August 31, 2026</p>
  <div class="table-wrap">
    <div class="table-head grid-main">
      <span class="th">#</span><span class="th">Name</span><span class="th center">Free Trial</span><span class="th center">Signed for Paid</span><span class="th center">Cancelled</span><span></span><span></span>
    </div>`;

  r.forEach((ae, idx) => {
    const isOpen = state.expanded[region].has(ae.id);

    // Same scoring as the sort, so displayed rank numbers agree with order.
    const scoreOf = (c) => ({
      paid:     c.clients.filter(x=>x.status==="Signed for Paid").length,
      trial:    c.clients.filter(x=>x.status==="Signed for Free Trial").length,
      attended: c.clients.filter(x=>x.status==="Demo Attended"||x.status==="Discovery Attended").length,
      isZero:   c.clients.filter(x=>x.status==="Signed for Paid").length===0
              && c.clients.filter(x=>x.status==="Signed for Free Trial").length===0
              && c.clients.filter(x=>x.status==="Demo Attended"||x.status==="Discovery Attended").length===0,
    });
    const cur = scoreOf(ae);
    let rank = 1;
    for (let i=0; i<idx; i++) {
      const prev = scoreOf(r[i]);
      const prevBeatsCur =
        (prev.isZero !== cur.isZero) ? !prev.isZero :
        (prev.paid !== cur.paid) ? prev.paid > cur.paid :
        (prev.trial !== cur.trial) ? prev.trial > cur.trial :
        prev.attended > cur.attended;
      if (prevBeatsCur) rank = i+2;
    }
    const nc = state.pending[region][ae.id] || {name:"", status:STATUSES[STATUSES.length-1], pkg:""};
    const freeTrials = ae.clients.filter(c=>c.status==="Signed for Free Trial").length;
    const cancelledCount = ae.clients.filter(c=>c.status==="Cancelled").length;
    const paidCount = cur.paid;
    const hasSigned = paidCount > 0;
    const totalCount = ae.clients.length;
    const rankLabel = rank<=3 && !cur.isZero ? `<span class="ae-rank">${TROPHY[rank-1]}</span>` : `<span class="ae-rank num">#${rank}</span>`;
    const ns = SS[nc.status] || Object.values(SS)[Object.keys(SS).length-1];

    html += `<div class="ae-row-wrap">
      <div class="ae-row grid-main${isOpen?" open":""}" onclick="toggleExpand('${region}',${ae.id})">
        <div>${rankLabel}</div>
        <div class="ae-name${hasSigned?" active":(totalCount>0?"":" muted")}">${ae.name}</div>
        <div class="ae-stat${freeTrials===0?" muted":""}">${freeTrials>0?`<span style="font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--paid-bg);color:var(--paid-color);border:0.5px solid var(--paid-border)">${freeTrials}</span>`:"—"}</div>
        <div class="ae-stat">${paidCount>0?`<span class="signed-pill">${paidCount}</span>`:`<span style="color:var(--text-faint)">—</span>`}</div>
        <div class="ae-stat">${cancelledCount>0?`<span style="font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--cancel-bg);color:var(--cancel-color);border:0.5px solid var(--cancel-border)">${cancelledCount}</span>`:`<span style="color:var(--text-faint)">—</span>`}</div>
        <div class="chevron-cell"><i class="ti ti-chevron-${isOpen?"up":"down"}" style="font-size:15px;color:var(--text-muted)"></i></div>
        <div class="chevron-cell"><button class="del-btn" onclick="event.stopPropagation();deleteAE('${region}',${ae.id})" title="Delete AE"><i class="ti ti-trash" style="font-size:14px"></i></button></div>
      </div>`;

    if (isOpen) {
      html += `<div class="ae-detail" onclick="event.stopPropagation()">`;
      if (ae.clients.length > 0) {
        html += `<table class="clients-table"><colgroup><col style="width:33%"/><col style="width:37%"/><col style="width:20%"/><col style="width:10%"/></colgroup>
          <thead><tr><th>Client</th><th style="padding-left:10px">Status</th><th style="padding-left:10px">Package</th><th></th></tr></thead><tbody>`;
        ae.clients.forEach((c, ci) => {
          const cs = SS[c.status] || Object.values(SS)[Object.keys(SS).length-1];
          const stOpts = STATUSES.map(s=>`<option value="${s}"${s===c.status?" selected":""}>${s}</option>`).join("");
          html += `<tr>
            <td>${c.name}</td>
            <td style="padding-left:10px"><select class="status-select" onchange="updateClient('${region}',${ae.id},${ci},'status',this.value)" style="background:${cs.bg};color:${cs.color};border:0.5px solid ${cs.border}">${stOpts}</select></td>
            <td style="padding-left:10px"><select class="pkg-select" onchange="updateClient('${region}',${ae.id},${ci},'pkg',this.value)">${PKGS.map(p=>`<option value="${p}"${p===c.pkg?" selected":""}>${p||"—"}</option>`).join("")}</select></td>
            <td style="text-align:right"><button onclick="if(confirm('Remove this client?'))removeClient('${region}',${ae.id},${ci})" style="background:var(--cancel-bg);border:0.5px solid var(--cancel-border);color:var(--cancel-color);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-trash" style="font-size:12px"></i> Delete</button></td>
          </tr>`;
        });
        html += `</tbody></table>`;
      }
      const stOpts2 = STATUSES.map(s=>`<option value="${s}"${s===nc.status?" selected":""}>${s}</option>`).join("");
      html += `<div class="add-client-row">
        <input class="add-input" type="text" placeholder="Client name…" value="${nc.name.replace(/"/g,'&quot;')}" oninput="setPending('${region}',${ae.id},'name',this.value)" onkeydown="if(event.key==='Enter')addClient('${region}',${ae.id})"/>
        <select class="add-status-sel" onchange="setPending('${region}',${ae.id},'status',this.value)" style="background:${ns.bg};color:${ns.color};border:0.5px solid ${ns.border}">${stOpts2}</select>
        <select class="add-pkg-sel" onchange="setPending('${region}',${ae.id},'pkg',this.value)">${PKGS.map(p=>`<option value="${p}"${p===nc.pkg?" selected":""}>${p||"No package"}</option>`).join("")}</select>
        <button class="add-btn" onclick="addClient('${region}',${ae.id})">+ Add client</button>
      </div>`;
      if (ae.clients.length===0) html += `<p class="empty-msg">No clients yet — add one above.</p>`;
      html += `</div>`;
    }
    html += `</div>`;
  });

  html += `</div>
  <div class="add-ae-row">
    <input class="add-ae-input" type="text" placeholder="Add Name" value="${state.newAE[region].replace(/"/g,'&quot;')}" oninput="state.newAE['${region}']=this.value" onkeydown="if(event.key==='Enter')addAE('${region}')"/>
    <button class="add-ae-btn" onclick="addAE('${region}')">+ Add</button>
  </div>
  <div class="sync-bar">
    <span>Last updated: ${fmtTime(state.ts[region])}</span>
    <button class="export-btn" onclick="exportData('${region}')"><i class="ti ti-download" style="font-size:13px"></i> Export JSON</button>
  </div>`;

  document.getElementById("tab-"+region).innerHTML = html;
}

function toggleExpand(region,id){state.expanded[region].has(id)?state.expanded[region].delete(id):state.expanded[region].add(id);renderRegion(region);}
function switchTab(tab){state.activeTab=tab;document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active",["us","sa"][i]===tab));document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));document.getElementById("tab-"+tab).classList.add("active");}
function deleteAE(region,id){if(!confirm("Delete this AE and all their clients?"))return;mutate(region,()=>{state.data[region]=state.data[region].filter(a=>a.id!==id);});}
function updateClient(region,aeId,ci,field,val){mutate(region,()=>{const ae=state.data[region].find(a=>a.id===aeId);if(ae)ae.clients[ci][field]=val;});}
function removeClient(region,aeId,ci){mutate(region,()=>{const ae=state.data[region].find(a=>a.id===aeId);if(ae)ae.clients.splice(ci,1);});}
function setPending(region,aeId,field,val){if(!state.pending[region][aeId])state.pending[region][aeId]={name:"",status:Object.keys(REGIONS[region].SS)[Object.keys(REGIONS[region].SS).length-1],pkg:""};state.pending[region][aeId][field]=val;if(field==="status")renderRegion(region);}
function addClient(region,aeId){const nc=state.pending[region][aeId]||{name:"",status:Object.keys(REGIONS[region].SS)[Object.keys(REGIONS[region].SS).length-1],pkg:""};if(!nc.name.trim())return;mutate(region,()=>{const ae=state.data[region].find(a=>a.id===aeId);if(ae)ae.clients.push({...nc});state.pending[region][aeId]={name:"",status:Object.keys(REGIONS[region].SS)[Object.keys(REGIONS[region].SS).length-1],pkg:""};});}
function addAE(region){const name=state.newAE[region].trim();if(!name)return;mutate(region,()=>{state.data[region].push({id:Date.now(),name,clients:[]});state.newAE[region]="";});}
function exportData(region){const blob=new Blob([JSON.stringify({region,data:state.data[region],exported:new Date().toISOString()},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`netsurit-${region}-leaderboard.json`;a.click();}
function saveForGithub(){
  const now = Date.now();
  const dateStr = new Date(now).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});

  // Start from the file as it was originally served, so we never capture
  // rendered DOM state — only the source plus our baked data block.
  let html = ORIGINAL_HTML;

  // Write the live data into the BAKED block. This is what makes Save real:
  // whoever opens the file next reads this instead of the old built-in data.
  const baked = JSON.stringify({
    us: state.data.us,
    sa: state.data.sa,
    savedAt: now
  });
  html = html.replace(/const BAKED = [\s\S]*?;\n/, "const BAKED = " + baked + ";\n");

  // Update the visible "Last updated" date.
  html = html.replace(/(id="file-ts">)[^<]*/, "$1" + dateStr);

  const blob = new Blob([html], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function updateBrowserTs(){
  const ts=state.ts.us||state.ts.sa;
  const el=document.getElementById("browser-ts");
  if(el&&ts)el.textContent=new Date(Number(ts)).toLocaleString([],{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
}

// Keep a pristine copy of the page source so Save writes clean HTML,
// not the mutated DOM.
let ORIGINAL_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
fetch(window.location.href, {cache:"no-store"})
  .then(r => r.text())
  .then(t => { if (t && t.indexOf("const BAKED") !== -1) ORIGINAL_HTML = t; })
  .catch(()=>{});

// Render immediately with local/init data
renderRegion("us");
renderRegion("sa");
renderCombined();
updateBrowserTs();

// Then fetch cloud data and re-render if updated
(async () => {
  const cloud = await loadFromCloud();
  if (cloud && cloud.us && cloud.sa) {
    state.data.us = cloud.us;
    state.data.sa = cloud.sa;
    if (cloud.ts) { state.ts.us = cloud.ts.us; state.ts.sa = cloud.ts.sa; }
    localStorage.setItem(REGIONS.us.sk, JSON.stringify(cloud.us));
    localStorage.setItem(REGIONS.sa.sk, JSON.stringify(cloud.sa));
    renderRegion("us");
    renderRegion("sa");
    renderCombined();
    updateBrowserTs();
  }
})();
